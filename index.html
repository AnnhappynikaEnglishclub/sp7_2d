<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0c29">
<title>📚 Bookworms — Vocabulary Game</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{overscroll-behavior:none;touch-action:manipulation;height:100%;height:100dvh}
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

.layout{display:flex;height:100%;height:100dvh}
.sidebar{position:fixed;top:0;left:0;width:270px;height:100%;height:100dvh;background:rgba(15,12,41,0.96);border-right:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(20px);display:flex;flex-direction:column;z-index:50;overflow-y:auto;padding-top:env(safe-area-inset-top)}
.sidebar-header{padding:24px 20px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-header h1{font-size:1.15em;font-weight:900;background:linear-gradient(135deg,#f093fb,#f5576c,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sidebar-header .sub{font-size:0.78em;color:#a0a0c0;margin-top:4px}
.sidebar-stats{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center;font-size:0.88em}
.sidebar-stats .stat{display:flex;align-items:center;gap:4px}
.level-badge{background:linear-gradient(135deg,#f5576c,#ff6b6b);padding:2px 10px;border-radius:20px;font-weight:700;font-size:0.88em}
.xp-bar-side{margin:0 20px 12px;background:rgba(255,255,255,0.08);border-radius:20px;height:6px;overflow:hidden}
.xp-fill-side{height:100%;background:linear-gradient(90deg,#f093fb,#f5576c,#ffd200);border-radius:20px;transition:width 0.8s}
.sidebar-nav{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:13px 16px;background:transparent;border:none;border-radius:12px;color:#8888aa;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.95em;cursor:pointer;transition:all 0.3s;text-align:left;min-height:48px}
.nav-btn:hover{background:rgba(255,255,255,0.07);color:#fff}
.nav-btn.active{background:linear-gradient(135deg,rgba(240,147,251,0.18),rgba(245,87,108,0.12));color:#fff;border:1px solid rgba(240,147,251,0.25)}
.nav-btn .nav-icon{font-size:1.3em;width:30px;text-align:center}
.nav-btn .nav-num{font-size:0.78em;color:#4ade80;margin-left:auto;font-weight:600}
.main-content{margin-left:270px;flex:1;height:100%;height:100dvh;overflow-y:auto;padding:28px 36px}

.mobile-header{display:none;position:fixed;top:0;left:0;right:0;height:calc(50px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:rgba(15,12,41,0.98);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);z-index:100;align-items:center;justify-content:center}
.mobile-header h1{font-size:0.95em;font-weight:900;background:linear-gradient(135deg,#f093fb,#f5576c,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.mobile-header .stats{position:absolute;right:12px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:8px;font-size:0.75em}
.mobile-header .stats .stat{display:flex;align-items:center;gap:3px}

.mobile-tabbar{display:none;position:fixed;bottom:0;left:0;right:0;height:calc(65px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(15,12,41,0.98);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);z-index:100}
.tabbar-scroll{display:flex;overflow-x:auto;height:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabbar-scroll::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;border:none;color:#8888aa;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.7em;cursor:pointer;transition:all 0.3s;padding:8px 4px;position:relative}
.tab-btn:active{transform:scale(0.95)}
.tab-btn.active{color:#fff}
.tab-btn.active::before{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:linear-gradient(90deg,#f093fb,#f5576c);border-radius:0 0 3px 3px}
.tab-btn .tab-icon{font-size:1.4em}
.tab-btn .tab-num{font-size:0.7em;color:#4ade80;margin-top:2px}

.mobile-content{display:none;flex:1;height:100%;height:100dvh;overflow-y:auto;padding:calc(50px + env(safe-area-inset-top)) 16px calc(65px + env(safe-area-inset-bottom)) 16px}

@media(max-width:850px){
  .sidebar{display:none}
  .main-content{display:none}
  .mobile-header{display:flex}
  .mobile-tabbar{display:block}
  .mobile-content{display:block}
}

.task-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.task-title{font-size:1.8em;font-weight:900}
.task-score{font-weight:700;color:#4ade80;font-size:1.1em}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.fc-card{height:300px;perspective:1000px;cursor:pointer}
.fc-card-inner{position:relative;width:100%;height:100%;transition:transform 0.6s;transform-style:preserve-3d}
.fc-card.flipped .fc-card-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;overflow:hidden}
.fc-front{background:linear-gradient(135deg,rgba(240,147,251,0.12),rgba(245,87,108,0.12));border:2px solid rgba(240,147,251,0.2)}
.fc-front .fc-img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:rgba(255,255,255,0.05)}
.fc-front .fc-word{font-size:1.4em;font-weight:900;margin-bottom:6px;word-break:break-word;line-height:1.2}
.fc-front .fc-type{font-size:0.85em;color:#a0a0c0}
.fc-front .fc-hint{font-size:0.75em;color:#8888aa;margin-top:auto}
.fc-back{background:linear-gradient(135deg,rgba(74,222,128,0.12),rgba(59,130,246,0.12));border:2px solid rgba(74,222,128,0.2);transform:rotateY(180deg)}
.fc-back .fc-img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:rgba(255,255,255,0.05)}
.fc-back .fc-trans{font-size:1.25em;font-weight:800;color:#ffd200;margin-bottom:8px;word-break:break-word;line-height:1.3}
.fc-back .fc-en{font-size:0.95em;color:#a0a0c0;word-break:break-word}
.fc-audio{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#f093fb,#f5576c);border:2px solid #fff;border-radius:50%;width:48px;height:48px;font-size:1.5em;cursor:pointer;transition:all 0.3s;z-index:5;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(245,87,108,0.6);min-width:48px;min-height:48px}
.fc-audio:active{transform:scale(0.92)}
.quiz-card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:22px;padding:36px;text-align:center;margin-bottom:24px}
.quiz-card h2{font-size:2.2em;font-weight:900;word-break:break-word}
.quiz-card .qtype{color:#a0a0c0;font-size:1em;margin-top:6px}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.quiz-opt{background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.12);border-radius:16px;padding:18px;color:#fff;font-family:'Nunito',sans-serif;font-weight:700;font-size:1.05em;cursor:pointer;transition:all 0.25s;text-align:center;word-break:break-word;min-height:60px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.quiz-opt:active{transform:scale(0.97)}
.quiz-opt.right{border-color:#4ade80;background:rgba(74,222,128,0.2)}
.quiz-opt.wrong{border-color:#f5576c;background:rgba(245,87,108,0.2)}
.quiz-progress{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}
.quiz-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.15);transition:all 0.3s}
.quiz-dot.ok{background:#4ade80}.quiz-dot.no{background:#f5576c}.quiz-dot.cur{background:#ffd200;transform:scale(1.4)}
.fb{font-weight:700;font-size:1.2em;margin:14px 0;min-height:32px}
.fb.ok{color:#4ade80}.fb.no{color:#f5576c}
.match-area{display:flex;flex-direction:column;gap:20px}
.match-cols{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.match-col{display:flex;flex-direction:column;gap:10px;min-width:200px;transition:all 0.4s}
.match-item{padding:14px 20px;border-radius:14px;font-weight:700;font-size:1em;cursor:pointer;transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);text-align:center;min-width:180px;word-break:break-word;min-height:52px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.match-item:active{transform:scale(0.97)}
.match-eng{background:rgba(240,147,251,0.1);border:2px solid rgba(240,147,251,0.25)}
.match-rus{background:rgba(59,130,246,0.1);border:2px solid rgba(59,130,246,0.25)}
.match-item.selected{box-shadow:0 0 25px rgba(255,210,0,0.5);border-color:#ffd200;background:rgba(255,210,0,0.15)}
.match-item.matched-anim{transform:scale(0);opacity:0;height:0;padding:0;margin:0;overflow:hidden;pointer-events:none}
.match-matched-section{margin-top:24px;padding:20px;background:rgba(74,222,128,0.06);border:2px solid rgba(74,222,128,0.25);border-radius:18px}
.match-matched-title{text-align:center;color:#4ade80;font-weight:700;margin-bottom:12px;font-size:1.05em}
.match-matched-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.match-pair{display:flex;align-items:center;gap:8px;padding:10px 18px;background:rgba(74,222,128,0.12);border:2px solid rgba(74,222,128,0.4);border-radius:12px;font-size:0.95em;font-weight:700;animation:fadeIn 0.4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.match-pair .mp-en{color:#f093fb}
.match-pair .mp-arrow{color:#a0a0c0;font-size:1.2em}
.match-pair .mp-ru{color:#4ade80}
.bingo-layout{display:flex;flex-direction:column;align-items:center;gap:24px}
.bingo-caller-panel{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:28px;text-align:center;width:100%;max-width:550px}
.bingo-caller-word{font-size:1.8em;font-weight:900;color:#ffd200;min-height:55px;margin:14px 0;display:flex;align-items:center;justify-content:center;word-break:break-word}
.bingo-caller-lang{font-size:0.9em;color:#a0a0c0;margin-bottom:10px}
.bingo-grid-panel{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:700px;width:100%}
.bingo-cell{padding:14px 8px;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.1);border-radius:14px;font-weight:700;font-size:0.9em;cursor:pointer;transition:all 0.2s;text-align:center;min-width:0;height:80px;display:flex;align-items:center;justify-content:center;word-break:break-word;overflow:hidden;line-height:1.2;min-height:80px}
.bingo-cell:active{transform:scale(0.95)}
.bingo-cell.mk{background:rgba(74,222,128,0.25);border-color:#4ade80;color:#4ade80}
.bingo-cell.hint-hl{background:rgba(255,210,0,0.2);border-color:#ffd200;animation:pulseG 1s infinite alternate}
@keyframes pulseG{from{box-shadow:0 0 5px rgba(255,210,0,0.3)}to{box-shadow:0 0 20px rgba(255,210,0,0.7)}}
.bingo-cell.wrong-click{animation:shake 0.4s;border-color:#f5576c}
.fl-container{position:relative;background:#000;border-radius:20px;overflow:hidden;min-height:500px;cursor:none;touch-action:none}
.fl-words{position:relative;z-index:1;padding:50px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;justify-items:center;align-items:center}
.fl-word{font-size:1.4em;font-weight:800;color:rgba(255,255,255,0.06);cursor:pointer;padding:10px 14px;border-radius:12px;transition:all 0.3s;user-select:none;text-align:center;width:100%;word-break:break-word;min-height:44px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.fl-word.correct-click{color:#4ade80!important;text-shadow:0 0 30px rgba(74,222,128,1)}
.fl-word.wrong-click{color:#f5576c!important}
.fl-light{position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.98) 0%,rgba(255,255,255,0.4) 30%,transparent 65%);pointer-events:none;z-index:2;transform:translate(-50%,-50%)}
.fl-info{text-align:center;padding:20px;background:rgba(255,255,255,0.04);border-top:1px solid rgba(255,255,255,0.08)}
.fl-target{font-size:1.5em;font-weight:900;color:#ffd200;word-break:break-word}
.fl-counter{color:#a0a0c0;font-size:0.95em;margin-top:6px}
.ws-container{text-align:center}
.ws-grid{display:inline-grid;gap:2px;margin:14px auto}
.ws-cell{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.85em;border-radius:6px;background:rgba(255,255,255,0.05);cursor:pointer;transition:all 0.15s;text-transform:uppercase;user-select:none;min-width:32px;min-height:32px}
.ws-cell:active{background:rgba(255,255,255,0.14)}
.ws-cell.sel{background:rgba(240,147,251,0.35);border:2px solid #f093fb}
.ws-cell.found{background:rgba(74,222,128,0.25);color:#4ade80}
.wlist{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:14px 0}
.wchip{padding:8px 14px;background:rgba(255,255,255,0.07);border-radius:18px;font-size:0.88em;font-weight:600;transition:all 0.3s;min-height:36px;display:flex;align-items:center}
.wchip.found{background:rgba(74,222,128,0.2);color:#4ade80;text-decoration:line-through}
.odd-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:30px 0}
.odd-card{flex:1;min-width:180px;max-width:240px;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.1);border-radius:18px;padding:16px;text-align:center;cursor:pointer;transition:all 0.3s}
.odd-card:active{transform:scale(0.97)}
.odd-card .odd-img{width:100%;height:130px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:rgba(255,255,255,0.05)}
.odd-card .odd-emoji{font-size:3.5em;margin-bottom:12px}
.odd-card .odd-word{font-weight:800;font-size:1.05em;margin-bottom:6px;word-break:break-word;line-height:1.2}
.odd-card .odd-trans{font-size:0.82em;color:#a0a0c0;word-break:break-word;line-height:1.3}
.odd-card.sel{border-color:#4ade80;background:rgba(74,222,128,0.18)}
.odd-card.bad{border-color:#f5576c;background:rgba(245,87,108,0.18);animation:shake 0.4s}
.uns-target{font-size:2em;font-weight:900;color:#ffd200;text-align:center;letter-spacing:3px;margin:20px 0;text-shadow:0 0 20px rgba(255,210,0,0.3);word-break:break-word;line-height:1.3}
.uns-slots{display:flex;gap:8px;justify-content:center;margin:24px 0;min-height:64px;flex-wrap:wrap}
.uns-slot{width:54px;height:54px;background:rgba(255,255,255,0.04);border:2px dashed rgba(255,255,255,0.18);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4em;font-weight:800;cursor:pointer;transition:all 0.2s;text-transform:uppercase;min-width:54px;min-height:54px}
.uns-slot:active{transform:scale(0.95)}
.uns-slot.fil{border-style:solid;background:rgba(255,255,255,0.1);border-color:#f093fb}
.uns-slot.space-slot{border-style:none;background:rgba(255,255,255,0.02);border-color:rgba(255,255,255,0.05);width:28px}
.uns-letters{display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.uns-let{width:54px;height:54px;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.18);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4em;font-weight:800;cursor:pointer;transition:all 0.2s;text-transform:uppercase;user-select:none;min-width:54px;min-height:54px}
.uns-let:active{transform:scale(0.95)}
.uns-let.used{opacity:0.2;pointer-events:none}
.write-card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:32px;text-align:center;margin-bottom:20px}
.write-card .wc-trans{font-size:1.7em;font-weight:800;color:#ffd200;margin-bottom:6px;word-break:break-word;line-height:1.3}
.write-card .wc-type{font-size:0.95em;color:#a0a0c0}
.write-input{width:100%;padding:18px 22px;background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.13);border-radius:16px;color:#fff;font-family:'Nunito',sans-serif;font-size:1.4em;font-weight:700;text-align:center;outline:none;transition:all 0.3s;margin:16px 0;min-height:60px}
.write-input:focus{border-color:#f093fb}
.write-input.right{border-color:#4ade80;background:rgba(74,222,128,0.12)}
.write-input.wrong{border-color:#f5576c;background:rgba(245,87,108,0.12)}
.write-hints{display:flex;gap:12px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.hint-btn{padding:12px 18px;background:rgba(255,210,0,0.12);border:1px solid rgba(255,210,0,0.3);border-radius:12px;color:#ffd200;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.92em;cursor:pointer;transition:all 0.3s;min-height:48px;display:flex;align-items:center}
.hint-btn:active{transform:scale(0.95);background:rgba(255,210,0,0.25)}
.hint-display{font-size:1.4em;font-weight:800;color:#ffd200;letter-spacing:5px;margin:10px 0;min-height:36px}
.res-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.78);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeUp 0.3s;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.res-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(255,255,255,0.13);border-radius:24px;padding:40px;text-align:center;max-width:420px;width:90%;animation:scaleIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275)}
@keyframes scaleIn{from{transform:scale(0.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.res-emoji{font-size:3.5em;margin-bottom:14px}
.res-title{font-size:1.8em;font-weight:900;margin-bottom:10px}
.res-sc{font-size:1.2em;color:#a0a0c0;margin-bottom:6px}
.res-xp{font-size:1.15em;color:#ffd200;font-weight:700;margin-bottom:20px}
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 32px;background:linear-gradient(135deg,#f093fb,#f5576c);border:none;border-radius:16px;color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:1.1em;cursor:pointer;transition:all 0.3s;margin-top:12px;min-height:56px;min-width:160px}
.btn-p:active{transform:scale(0.96)}
.btn-s{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:14px;color:#fff;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.95em;cursor:pointer;transition:all 0.3s;margin:6px;min-height:48px}
.btn-s:active{transform:scale(0.96);background:rgba(255,255,255,0.16)}
.confetti-box{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:300}
.conf-p{position:absolute;width:8px;height:8px;border-radius:2px;animation:confFall linear forwards}
@keyframes confFall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

let G={xp:0,lvl:1,xpNext:150,streak:0,scores:{},learned:new Set(),currentTask:null};

function sh(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function save(){try{localStorage.setItem('bookV10',JSON.stringify({xp:G.xp,lvl:G.lvl,xpNext:G.xpNext,scores:G.scores,learned:[...G.learned]}))}catch(e){}}
function addXP(n){G.xp+=n;while(G.xp>=G.xpNext){G.xp-=G.xpNext;G.lvl++;G.xpNext=Math.floor(G.xpNext*1.3)}save();updUI()}
function markLearned(r){G.learned.add(r);save()}
function updUI(){
  document.getElementById('xpN').textContent=G.xp;
  document.getElementById('lvlN').textContent=G.lvl;
  document.getElementById('learnedN').textContent=G.learned.size;
  document.getElementById('xpFill').style.width=(G.xp/G.xpNext*100)+'%';
  ['flashcards','quiz','match','bingo','flashlight','wordsearch','oddone','unscramble','write'].forEach(t=>{let el=document.getElementById('n-'+t);if(el)el.textContent=G.scores[t]||0});
}
function updStreak(ok){G.streak=ok?G.streak+1:0;const el=document.getElementById('streakEl');if(G.streak>=3){el.style.display='block';document.getElementById('streakN').textContent=G.streak}else{el.style.display='none'}}
function confetti(){const c=document.createElement('div');c.className='confetti-box';document.body.appendChild(c);const cols=['#f093fb','#f5576c','#ffd200','#4ade80','#3b82f6','#a78bfa'];for(let i=0;i<50;i++){const p=document.createElement('div');p.className='conf-p';p.style.left=Math.random()*100+'%';p.style.background=cols[Math.floor(Math.random()*cols.length)];p.style.animationDuration=(2+Math.random()*2)+'s';p.style.animationDelay=Math.random()*.4+'s';p.style.width=(5+Math.random()*7)+'px';p.style.height=(5+Math.random()*7)+'px';c.appendChild(p)}setTimeout(()=>c.remove(),4500)}
function showResult(title,emoji,score,total,xp){const ov=document.createElement('div');ov.className='res-overlay';ov.onclick=e=>{if(e.target===ov)ov.remove()};const pct=Math.round(score/total*100);let msg=pct===100?'Идеально! 🎉':pct>=80?'Отлично! 👏':pct>=60?'Хорошо! ':'Попробуй ещё! 💪';ov.innerHTML=`<div class="res-card"><div class="res-emoji">${emoji}</div><div class="res-title">${msg}</div><div class="res-sc">${score} / ${total}</div><div class="res-xp">+${xp} XP</div><button class="btn-p" onclick="this.closest('.res-overlay').remove()">OK ✓</button></div>`;document.body.appendChild(ov);if(pct>=70)confetti()}
function speak(text,lang='en-US'){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=0.85;const voices=speechSynthesis.getVoices();const v=voices.find(v=>v.lang.startsWith(lang.split('-')[0]));if(v)u.voice=v;speechSynthesis.speak(u)}
if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}

function playSuccessSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const notes=[523.25,659.25,783.99];
    notes.forEach((freq,i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=freq;osc.type='sine';
      gain.gain.setValueAtTime(0.3,ctx.currentTime+i*0.1);
      gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+i*0.1+0.3);
      osc.start(ctx.currentTime+i*0.1);
      osc.stop(ctx.currentTime+i*0.1+0.3);
    });
  }catch(e){}
}
function playErrorSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(300,ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(200,ctx.currentTime+0.3);
    osc.type='sawtooth';
    gain.gain.setValueAtTime(0.2,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.3);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+0.3);
  }catch(e){}
}

function showTask(task,btn){
  document.querySelectorAll('.nav-btn,.tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  G.currentTask=task;
  const isMobile=window.innerWidth<=850;
  const container=isMobile?document.getElementById('taskContainerMobile'):document.getElementById('taskContainer');
  const initers={flashcards:initFlashcards,quiz:initQuiz,match:initMatch,bingo:initBingo,flashlight:initFlashlight,wordsearch:initWordSearch,oddone:initOddOne,unscramble:initUnscramble,write:initWrite};
  if(initers[task])initers[task](container);
  container.scrollTop=0;
}

      if(!cellShowEn&&cellAnsEn===currentWord.e)isCorrect=true;
    }else{
      if(cellShowEn&&cellAnsRu===currentWord.r)isCorrect=true;
    }
    if(isCorrect){

      document.getElementById('bSc').textContent=d.marked+' / 16';

      }
    }else{
      cell.classList.add('wrong-click');setTimeout(()=>cell.classList.remove('wrong-click'),400);updStreak(false);playErrorSound();
    }
  };
}

/* ===== 6. WORD SEARCH ===== */
function initWordSearch(container){
  const wordsList=W.map(w=>w.e.toUpperCase().replace(/[^A-Z]/g,''));
  const gs=14;const grid=Array.from({length:gs},()=>Array(gs).fill(''));
  const dirs=[[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1],[1,-1],[-1,1]];
  const placed=[];
  const sorted=wordsList.map((w,i)=>({w,idx:i})).sort((a,b)=>b.w.length-a.w.length);
  sorted.forEach(item=>{
    const word=item.w;const widx=item.idx;let att=0;let ok=false;
    while(att<200&&!ok){
      const dir=dirs[Math.floor(Math.random()*dirs.length)];const row=Math.floor(Math.random()*gs);const col=Math.floor(Math.random()*gs);
      let can=true;
      for(let i=0;i<word.length;i++){const r=row+dir[0]*i,c=col+dir[1]*i;if(r<0||r>=gs||c<0||c>=gs){can=false;break}if(grid[r][c]!==''&&grid[r][c]!==word[i]){can=false;break}}
      if(can){for(let i=0;i<word.length;i++)grid[row+dir[0]*i][col+dir[1]*i]=word[i];placed.push({word,row,col,dir,widx});ok=true}
      att++;
    }
  });
  const alpha='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let r=0;r<gs;r++)for(let c=0;c<gs;c++)if(grid[r][c]==='')grid[r][c]=alpha[Math.floor(Math.random()*26)];
  let ghtml=`<div class="ws-grid" style="grid-template-columns:repeat(${gs},1fr)">`;
  for(let r=0;r<gs;r++)for(let c=0;c<gs;c++)ghtml+=`<div class="ws-cell" data-r="${r}" data-c="${c}" onclick="wsClick(this)">${grid[r][c]}</div>`;
  ghtml+='</div>';
  window._wsData={grid,placed,found:[],gs,selecting:false,start:null};
  container.innerHTML=`<div class="task-header"><div class="task-title"> Word Search</div><div class="task-score" id="wsSc">0 / ${placed.length}</div></div><div class="ws-container">${ghtml}<div class="wlist" id="wlist">${placed.map(p=>`<div class="wchip" data-w="${p.word}">${p.word}</div>`).join('')}</div></div>`;
}
window.wsClick=function(cell){
  const d=window._wsData;const r=+cell.dataset.r,c=+cell.dataset.c;
  if(!d.selecting){d.selecting=true;d.start={r,c};cell.classList.add('sel')}
  else{
    const s=d.start;const dr=r-s.r,dc=c-s.c;
    if(dr===0&&dc===0){d.selecting=false;document.querySelectorAll('.ws-cell.sel').forEach(e=>e.classList.remove('sel'));return}
    const steps=Math.max(Math.abs(dr),Math.abs(dc));const sr=dr===0?0:dr/Math.abs(dr),sc=dc===0?0:dc/Math.abs(dc);
    if(dr!==0&&dc!==0&&Math.abs(dr)!==Math.abs(dc)){d.selecting=false;document.querySelectorAll('.ws-cell.sel').forEach(e=>e.classList.remove('sel'));return}
    let path=[];for(let i=0;i<=steps;i++){const cr=s.r+sr*i,cc=s.c+sc*i;const el=document.querySelector(`.ws-cell[data-r="${cr}"][data-c="${cc}"]`);if(el)path.push({r:cr,c:cc,el})}
    const word=path.map(p=>d.grid[p.r][p.c]).join('');const rev=word.split('').reverse().join('');
    const obj=d.placed.find(p=>p.word===word||p.word===rev);
    if(obj&&!d.found.includes(obj.word)){
      path.forEach(p=>{p.el.classList.remove('sel');p.el.classList.add('found')});d.found.push(obj.word);
      const chip=document.querySelector(`.wchip[data-w="${obj.word}"]`);if(chip)chip.classList.add('found');
      addXP(8);markLearned(W[obj.widx].r);playSuccessSound();document.getElementById('wsSc').textContent=d.found.length+' / '+d.placed.length;
      if(d.found.length===d.placed.length){G.scores.wordsearch=Math.max(G.scores.wordsearch||0,d.placed.length);updUI();setTimeout(()=>showResult('Word Search','',d.found.length,d.placed.length,d.found.length*8),600)}
    }else{path.forEach(p=>p.el.classList.remove('sel'));playErrorSound()}
    d.selecting=false;
  }
};

function initUnscramble(container){
  const order=sh(W);let idx=0,correct=0;
  function render(){
    if(idx>=29){addXP(correct*15);G.scores.unscramble=Math.max(G.scores.unscramble||0,correct);updUI();showResult('Unscramble','🧩',correct,29,correct*15);return}
    const w=order[idx];
    const targetDisplay=w.r.toUpperCase();
    const chars=w.e.split('');
    const letters=chars.filter(c=>c!==' ').map(c=>c.toUpperCase());
    const shuffledLetters=sh(letters);
    let slotsHtml='';
    for(let i=0;i<chars.length;i++){
      if(chars[i]===' '){
        slotsHtml+=`<div class="uns-slot space-slot" data-space="true">␣</div>`;
      }else{
        slotsHtml+=`<div class="uns-slot" onclick="unsRemove(this)"></div>`;
      }
    }
    container.innerHTML=`
      <div class="task-header"><div class="task-title"> Unscramble</div><div class="task-score">${idx}/29</div></div>
      <div class="quiz-card">
        <div style="font-size:1.2em;font-weight:700;color:#a0a0c0;margin-bottom:8px">Составь английское слово/фразу:</div>
        <div class="uns-target">${targetDisplay}</div>
        <div class="qtype" style="font-size:1.1em">${w.t}</div>
      </div>
      <div class="uns-slots" id="unsSlots">${slotsHtml}</div>
      <div class="uns-letters" id="unsLets">${shuffledLetters.map(l=>`<div class="uns-let" onclick="unsPlace(this)">${l}</div>`).join('')}</div>
      <div class="fb" id="fb"></div>`;
  }
  window.unsPlace=function(tile){
    const slots=document.querySelectorAll('#unsSlots .uns-slot:not(.space-slot)');
    for(let s of slots){
      if(!s.classList.contains('fil')&&!s.dataset.space){
        s.textContent=tile.textContent;s.classList.add('fil');tile.classList.add('used');break;
      }
    }
    unsCheck();
  };
  window.unsRemove=function(slot){
    if(!slot.classList.contains('fil'))return;
    const l=slot.textContent;slot.textContent='';slot.classList.remove('fil');
    const tiles=document.querySelectorAll('#unsLets .uns-let');
    for(let t of tiles){if(t.classList.contains('used')&&t.textContent===l){t.classList.remove('used');break}}
  };
  function unsCheck(){
    const allSlots=document.querySelectorAll('#unsSlots .uns-slot');
    const letterSlots=document.querySelectorAll('#unsSlots .uns-slot:not(.space-slot)');
    const ans=Array.from(allSlots).map(s=>s.dataset.space==='true'?' ':s.textContent).join('').trim().toLowerCase();
    const w=order[idx];const cor=w.e.toLowerCase();
    const letterCount=Array.from(letterSlots).filter(s=>s.classList.contains('fil')).length;
    const totalLetters=w.e.replace(/\s/g,'').length;
    if(letterCount<totalLetters)return;
    document.querySelectorAll('.uns-let').forEach(t=>t.style.pointerEvents='none');
    if(ans===cor){
      letterSlots.forEach(s=>s.style.background='rgba(74,222,128,.2)');
      document.getElementById('fb').innerHTML='✅';document.getElementById('fb').className='fb ok';
      correct++;addXP(12);updStreak(true);markLearned(w.r);playSuccessSound();
    }else{
      letterSlots.forEach(s=>s.style.background='rgba(245,87,108,.2)');
      document.getElementById('fb').innerHTML='❌ '+w.e;document.getElementById('fb').className='fb no';updStreak(false);playErrorSound();
    }
    setTimeout(()=>{idx++;render()},1600);
  }
  render();
}

/* ===== 9. WRITE ===== */
function initWrite(container){
  const order=sh(W);let idx=0,correct=0,hintLevel=0;
  function render(){
    hintLevel=0;
    if(idx>=29){addXP(correct*18);G.scores.write=Math.max(G.scores.write||0,correct);updUI();showResult('Write','✏️',correct,29,correct*18);return}
    const w=order[idx];
    container.innerHTML=`
      <div class="task-header"><div class="task-title">✏️ Write</div><div class="task-score">${idx}/29</div></div>
      <div class="write-card">
        <div class="wc-trans">${w.r}</div>
        <div class="wc-type">${w.t}</div>
        <div style="color:#a0a0c0;font-size:0.95em;margin-top:10px">Напиши это слово на <b style="color:#ffd200">английском</b>:</div>
      </div>
      <input type="text" class="write-input" id="wInp" placeholder="Введи слово..." autocomplete="off" autocapitalize="off" inputmode="text">
      <div class="write-hints">
        <button class="hint-btn" onclick="writeHint(1)">💡 1 буква</button>
        <button class="hint-btn" onclick="writeHint(2)">💡 3 буквы</button>
        <button class="hint-btn" onclick="writeHint(3)">💡 Показать</button>
      </div>
      <div class="hint-display" id="hintDisp"></div>
      <div style="text-align:center"><button class="btn-p" onclick="writeCheck()">Проверить ✓</button></div>
      <div class="fb" id="fb"></div>`;
    setTimeout(()=>{const i=document.getElementById('wInp');if(i){i.focus();i.value=''}},100);
    document.getElementById('wInp').addEventListener('keydown',e=>{if(e.key==='Enter')writeCheck()});
  }
  window.writeHint=function(level){
    const w=order[idx];const cor=w.e.toLowerCase();
    hintLevel=Math.max(hintLevel,level);
    const disp=document.getElementById('hintDisp');
    if(level===1){disp.textContent=cor[0]+'_'.repeat(cor.length-1)}
    else if(level===2){const show=Math.min(3,cor.length);let h='';for(let i=0;i<cor.length;i++){if(i<show)h+=cor[i];else h+=' _'};disp.textContent=h}
    else{disp.textContent=cor}
  };
  window.writeCheck=function(){
    const inp=document.getElementById('wInp');const ans=inp.value.trim().toLowerCase();
    const w=order[idx];const cor=w.e.toLowerCase();
    inp.style.pointerEvents='none';
    if(ans===cor){inp.classList.add('right');document.getElementById('fb').innerHTML='✅';document.getElementById('fb').className='fb ok';correct++;addXP(14);updStreak(true);markLearned(w.r);playSuccessSound()}
    else{inp.classList.add('wrong');document.getElementById('fb').innerHTML=' '+w.e;document.getElementById('fb').className='fb no';updStreak(false);playErrorSound()}
    setTimeout(()=>{idx++;render()},1500);
  };
  render();
}

updUI();
if(window.innerWidth<=850){showTask('flashcards',document.querySelector('.tab-btn'))}
else{showTask('flashcards',document.querySelector('.nav-btn'))}
</script>
